    <style>
      :root {
        --abyss: #00121f;
        --ocean: #002b49;
        --cyan: #00d1ff;
      }

      body {
        margin: 0;
        background: var(--abyss);
        color: white;
        font-family: 'Sora', sans-serif;
        overflow: hidden;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* The custom cursor is opt-in: #cursor stays hidden and the native pointer
         stays visible until JS confirms a mouse-like device. That way nothing
         depends on the script running. */
      #cursor {
        display: none;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        position: fixed;
        top: 0;
        left: 0;
        pointer-events: none;
        z-index: 1000;
        mix-blend-mode: difference;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition:
          width 0.3s ease,
          height 0.3s ease,
          background 0.3s ease,
          opacity 0.2s ease;
      }

      html.custom-cursor body {
        cursor: none;
      }

      html.custom-cursor #cursor {
        display: block;
      }

      #cursor.active {
        width: 60px;
        height: 60px;
        background: var(--cyan);
      }

      .liquid-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(circle at 50% 50%, var(--ocean) 0%, var(--abyss) 100%);
        opacity: 0.8;
      }

      #app {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(2rem, 5vw, 4rem);
        box-sizing: border-box;
      }

      /* No filter and no transform on #app: the wave is drawn by .wave-ring
         elements, which keeps the text crisp and the cost on the compositor. */

      .card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        padding: clamp(2rem, 8vw, 5rem);
        border-radius: clamp(2rem, 5vw, 4rem);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        max-width: 800px;
        width: 100%;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        animation: card-in 800ms cubic-bezier(0.22, 0.61, 0.36, 1);
        position: relative;
      }

      /* Entrance: fade only, no movement. Implemented as a CSS animation instead
         of a JS-triggered transition, so it also runs without JS and always ends
         with the card fully visible.

         It starts at opacity 0.2, not 0: content painted at opacity 0 does not
         count as a contentful paint, which made Lighthouse abort with NO_FCP and
         left FCP/LCP unmeasurable (the original 0 → 1 fade was exactly that).
         On this dark background 0.2 already reads as "fading in from nothing". */
      @keyframes card-in {
        from {
          opacity: 0.2;
        }
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
        #cursor,
        .social-link {
          transition: none;
        }
        .social-link:hover {
          transform: none;
        }
      }

      h1 {
        font-size: clamp(2.5rem, 12vw, 5.5rem);
        margin: 0;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.05em;
      }

      p {
        opacity: 0.4;
        font-size: clamp(1rem, 4vw, 1.4rem);
        margin-top: 1.5rem;
        font-weight: 300;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      .social-links {
        margin-top: 3rem;
        display: flex;
        gap: clamp(1rem, 3vw, 2rem);
        justify-content: center;
        padding: 0;
        list-style: none;
      }

      .social-link {
        color: white;
        text-decoration: none;
        opacity: 0.3;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease,
          color 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(44px, 8vw, 60px);
        height: clamp(44px, 8vw, 60px);
      }

      .social-link svg {
        width: clamp(24px, 5vw, 36px);
        height: clamp(24px, 5vw, 36px);
      }

      .social-link:hover {
        opacity: 1;
        transform: scale(1.2);
        color: var(--cyan);
      }

      .company-link {
        color: inherit;
        text-decoration: none;
      }

      .impact-tap {
        display: none;
      }

      @media (hover: none) and (pointer: coarse) {
        .impact-click {
          display: none;
        }
        .impact-tap {
          display: inline;
        }
        /* Disable hover effects on touch devices */
        .social-link:hover {
          opacity: 0.3;
          transform: none;
          color: white;
        }
        .company-link:hover {
          color: inherit;
        }
      }

      /* Expanding wave rings. Each ring is one fixed-size element that is scaled
         up and faded out, so the work stays on the compositor: no repaint of the
         page, no SVG filter (feDisplacementMap/feTurbulence is unreliable and
         expensive on mobile GPUs). Three rings per click, staggered, read as a
         wave travelling outwards instead of a pattern that zooms in and out. */
      .wave-ring {
        position: fixed;
        left: var(--x, 50%);
        top: var(--y, 50%);
        width: var(--size, 150vmax);
        height: var(--size, 150vmax);
        margin-left: calc(var(--size, 150vmax) / -2);
        margin-top: calc(var(--size, 150vmax) / -2);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        background: radial-gradient(
          circle,
          transparent 40%,
          rgba(0, 209, 255, 0.55) 46%,
          rgba(0, 209, 255, 0.16) 52%,
          transparent 62%
        );
        mix-blend-mode: screen;
        opacity: 0;
        transform: scale(0.02);
        will-change: transform, opacity;
      }

    <script>
      const cursor = document.getElementById('cursor');
      const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const canUseCustomCursor = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      document.addEventListener('mousemove', (e) => {
        if (!canUseCustomCursor) return;
        // Swapping the pointer only after real mouse movement keeps the native
        // cursor visible until we know the custom one can follow it.
        if (!document.documentElement.classList.contains('custom-cursor')) {
          document.documentElement.classList.add('custom-cursor');
        }
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        cursor.style.opacity = '1';
      });

      document.addEventListener('mouseleave', () => {
        if (canUseCustomCursor) cursor.style.opacity = '0';
      });

      document.addEventListener('mouseenter', () => {
        if (canUseCustomCursor) cursor.style.opacity = '1';
      });

      // Cursor hover effect
      const updateInteractive = () => {
        const interactiveElements = document.querySelectorAll('a, button');
        interactiveElements.forEach((el) => {
          el.addEventListener('mouseenter', () => cursor.classList.add('active'));
          el.addEventListener('mouseleave', () => cursor.classList.remove('active'));
        });
      };
      updateInteractive();

      // Enhanced email obfuscation with Caesar cipher
      document.querySelectorAll('.email-link').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          const enc1 = e.currentTarget.getAttribute('data-enc1');
          const enc2 = e.currentTarget.getAttribute('data-enc2');
          const a = parseInt(e.currentTarget.getAttribute('data-a'));
          const b = parseInt(e.currentTarget.getAttribute('data-b'));
          if (!enc1 || !enc2 || isNaN(a) || isNaN(b)) return;
          const shift = a - b; // decode shift
          const decode = (encoded) => {
            return encoded
              .split('')
              .map((c) => String.fromCharCode(c.charCodeAt(0) - shift))
              .join('');
          };
          const local = decode(enc1);
          const domain = decode(enc2);
          // Open mailto
          window.location.href = `mailto:${local}@${domain}`;
        });
      });

      // Three rings per click, staggered: the front of each one travels outwards
      // while it fades, so the eye reads a wave rolling away from the pointer.
      // Durations are deliberately different so the rings never move as a block.
      const WAVE_RINGS = [
        { delay: 0, duration: 2200, size: 200, opacity: 0.5 },
        { delay: 320, duration: 2500, size: 175, opacity: 0.34 },
        { delay: 650, duration: 2800, size: 150, opacity: 0.22 },
      ];

      const triggerWave = (clientX, clientY) => {
        const makeRing = (size) => {
          const el = document.createElement('div');
          el.className = 'wave-ring';
          el.style.setProperty('--x', clientX + 'px');
          el.style.setProperty('--y', clientY + 'px');
          el.style.setProperty('--size', size + 'vmax');
          document.body.appendChild(el);
          return el;
        };

        // With reduced motion the ring appears and fades, but never expands.
        if (prefersReducedMotion.matches) {
          const el = makeRing(140);
          el.style.transform = 'scale(1)';
          const pulse = el.animate([{ opacity: 0 }, { opacity: 0.28, offset: 0.3 }, { opacity: 0 }], {
            duration: 900,
            easing: 'ease-out',
          });
          pulse.onfinish = () => el.remove();
          return;
        }

        const boost = isTouchDevice ? 1.25 : 1;
        for (const ring of WAVE_RINGS) {
          const el = makeRing(ring.size);
          const duration = isTouchDevice ? ring.duration * 1.15 : ring.duration;
          const timing = { duration, delay: ring.delay };

          // Two separate animations: one segment for the travel (ease-out, so the
          // front slows as it spreads) and one for the light. Mixing both into a
          // single keyframe list would apply the easing twice and stutter.
          el.animate([{ transform: 'scale(0.02)' }, { transform: 'scale(1)' }], {
            ...timing,
            // Linear travel: a wave front moves at a steady speed. An ease-out
            // made it sprint away from the pointer and then crawl, which read as
            // a pulse rather than a rolling wave.
            easing: 'linear',
          });
          const fade = el.animate(
            [{ opacity: 0 }, { opacity: Math.min(ring.opacity * boost, 1), offset: 0.1 }, { opacity: 0 }],
            { ...timing, easing: 'linear' }
          );

          // Remove the ring when the fade ends, with a timer as a safety net:
          // a finish event never arrives if the tab stops producing frames.
          const cleanup = () => {
            if (el.isConnected) el.remove();
          };
          fade.onfinish = cleanup;
          fade.oncancel = cleanup;
          setTimeout(cleanup, duration + ring.delay + 100);
        }
      };

      // pointerdown covers mouse, touch and pen exactly once per interaction;
      // listening to mousedown and touchstart both double-fired on touch devices,
      // where the browser also synthesises a mousedown.
      document.addEventListener('pointerdown', (e) => {
        if (e.target.closest('a')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        triggerWave(e.clientX, e.clientY);
      });

    </script>
